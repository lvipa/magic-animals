name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=1 --no-file-parallelism
      - run: npm run build
      - run: python3 scripts/check-cat-studio.py
      - run: python3 scripts/check-audio-cast.py
      - run: python3 scripts/check-public-source.py
